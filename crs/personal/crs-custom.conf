# CRS Custom Overrides
# Stored on persistent volume to survive CRS upgrades
# See crs-setup.conf for full configuration options
#
# Changes from stock CRS:
# 900200 - Added WebDAV methods for Baikal CalDAV/CardDAV
# 900220 - Added text/calendar and text/vcard content types for Baikal
#
# ============================================================================
# REFACTOR NOTE - CRS 4.29.0 upgrade (see history below rule 9001012)
# ============================================================================
# The three Audiobookshelf exclusions (9001006, 9001008, 9001011) have been
# merged into a single tag-based rule, 9001012. Retired IDs are NOT reused.
#
# WHY: those rules enumerated six rule IDs each (930130, 932130, 932230,
# 932235, 932250, 932260). Every CRS release that adds a sibling to the unix
# RCE family silently punches a hole in all three lists at once, and the only
# symptom is a 403 at an inconvenient hour. 4.29's quote-evasion work
# (upstream #4649) is exactly that shape of change.
#
# Tag-based exclusion inherits future siblings automatically. The cost is
# breadth - see the trade-off block on 9001012 before assuming that's fine.
# ============================================================================
#
# Custom rule ID ranges (keep IDs unique across ALL loaded rules):
#   9000100-9000109  framework/app probes (Next.js Server Actions...)
#   9000110-9000119  scanner user agents (Go-http-client...)
#   9000120-9000129  crawler fleet fingerprints (Tencent...)

SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS REPORT PROPFIND PROPPATCH MKCOL COPY MOVE LOCK UNLOCK DELETE PUT'"

# NOTE: ver: bumped 4.26.0 -> 4.29.0 at upgrade time. This string is
# cosmetic (it only shows up in audit log entries) but a stale version here
# makes log forensics confusing later - it looks like the rule came from an
# older ruleset than the one actually running.
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.29.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/calendar| |text/vcard| |text/plain|'"

# Increase PCRE limits for complex response bodies (e.g. Matomo)
SecPcreMatchLimit 500000
SecPcreMatchLimitRecursion 500000

# Matomo - gzcompress in response body is minified JS not PHP leakage
SecRule REQUEST_HEADERS:Host "@streq analytics.spacecadetgrrl.me" \
    "id:9001001,phase:1,pass,nolog,\
    ctl:ruleRemoveById=953110"

# Matomo - internally accesses its own config.ini.php
# Left ID-based deliberately: this is one specific known file access on one
# vhost, not an open-ended class of false positives. Tag-based here would
# disable all LFI protection on the Matomo admin UI for no benefit.
SecRule REQUEST_HEADERS:Host "@streq analytics.spacecadetgrrl.me" \
    "id:9001002,phase:1,pass,nolog,\
    ctl:ruleRemoveById=930130"

# Jellyfin/funcoland - web client legitimately requests config.json
# Also left ID-based, same reasoning as 9001002.
#
# 4.29 FOOTNOTE: 930120 gained a broader "node_modules/" entry in
# lfi-os-files.data (was "node_modules/.bin" + "node_modules/.cache").
# This does NOT affect Jellyfin: the entry is trailing-slash anchored, and
# Jellyfin's bundler emits node_modules.<pkg>.bundle.js with a DOT, plus
# 930120 only inspects ARGS/ARGS_NAMES/COOKIES/XML - never the URL path.
# Verified against v4.29.0. No rule needed here.
SecRule REQUEST_HEADERS:Host "@streq funcoland.spacecadetgrrl.me" \
    "id:9001005,phase:1,pass,nolog,\
    ctl:ruleRemoveById=930130"

# Increase outbound threshold for Matomo
SecRule REQUEST_HEADERS:Host "@streq analytics.spacecadetgrrl.me" \
    "id:9001003,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=959100;TX:blocking_outbound_anomaly_score"

# Matomo is PHP, not Ruby - Ruby exception name patterns false-positive
# on Matomo's JS bundle (e.g. "EOFError" appearing in tracker/admin JS)
SecRule REQUEST_HEADERS:Host "@streq analytics.spacecadetgrrl.me" \
    "id:9001007,phase:1,pass,nolog,\
    ctl:ruleRemoveById=956100"

# Uptime Kuma - Socket.IO uses text/plain content type
SecRule REQUEST_HEADERS:Host "@streq uptime.integraldata.cc" \
    "id:9001004,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920420"

# Baïkal admin: form field names contain "::" (PHP class names, e.g.
# Baikal_Model_Config_Standard::submitted), which CRS 922130 mistakes for
# smuggled multipart headers. Exclude ONLY 922130, ONLY for multipart part
# headers, ONLY on dav.spacecadetgrrl.me/admin/. Everything else stays on.
#
# Phase 1 so it runs before 922130 (phase 2). ctl goes on the last link
# of the chain, so it only applies when both conditions match.
SecRule REQUEST_HEADERS:Host "@streq dav.spacecadetgrrl.me" \
    "id:9000118,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@beginsWith /admin/" \
        "ctl:ruleRemoveTargetById=922130;MULTIPART_PART_HEADERS"

# ============================================================================
# 9001012 - Audiobookshelf/newburycomics prose-metadata endpoints
# ============================================================================
# REPLACES (do not reuse these IDs):
#   9001006 - items/<id>/media          - library item metadata update
#   9001008 - podcasts/<id>/download-episodes, check-new
#   9001011 - podcasts (bare collection) - add-show-by-feed-URL
#
# THE UNDERLYING PROBLEM (unchanged from the originals):
# Book and podcast metadata is natural English prose containing HTML tags.
# Real unix command names are also ordinary English words, so descriptions
# trip the RCE rules constantly:
#   - "watch" in "we mostly watch AEW and ROH" scored 5 on 932235
#   - ">(spanning..." from an <em> tag matched shell-expression rules
#   - 2-3 char bigrams ("bus", "bub") in prose hit the short-command rules
# At PL1 the threshold is 5, so a single hit is a 403.
#
# WHY TAGS INSTEAD OF IDS:
# The originals each listed six IDs. That list was already the near-entirety
# of the PL1 unix RCE set, so we were not gaining precision from enumerating
# it - only gaining a maintenance burden that fails silently on upgrade.
#
# TRADE-OFF (accept deliberately or revert to IDs - do not half-do both):
#   attack-rce is BROADER than the six IDs. It additionally removes:
#     - 932171 shellshock (CVE-2014-6271) detection
#     - 932370 etc. Windows LOLBIN command detection
#     - any future RCE rule at any paranoia level
#   attack-lfi is BROADER than the bare 930130 the originals removed:
#     - it also covers 930100/930110 path traversal and 930120 OS-file access
#
# Both are judged acceptable HERE because these endpoints are a Node
# appliance's own API, reached only by an authenticated session, receiving
# prose. Windows LOLBIN and shellshock coverage on a Linux Node app is
# theatre. This reasoning does NOT generalise to the other vhosts above.
#
# WHY attack-lfi IS NEEDED AT ALL (new in 4.29):
# lfi-os-files.data broadened to a bare "node_modules/" entry, and 930120
# inspects ARGS - so a podcast show-note mentioning a "node_modules/" path
# (entirely plausible on a tech podcast) would now score on a rule the old
# 930130-only exclusion did not cover.
#
# SCOPING - REQUEST_FILENAME, not REQUEST_URI:
# REQUEST_FILENAME is the path WITHOUT the query string. REQUEST_URI includes
# it, which is why the old 9001011 had to use @streq on REQUEST_FILENAME to
# survive GET params. Using it uniformly means the anchors below behave
# predictably regardless of method.
#
# THE REGEX, branch by branch:
#   items/<uuid>/media(/...)?  - trailing (?:/.*)? preserves the original
#                                9001006 behaviour, which was unanchored
#   podcasts                   - EXACT, via the $ anchor on this branch, so
#                                it matches only the create/collection
#                                endpoint (old 9001011)
#   podcasts/<uuid>/download-episodes | check-new  - old 9001008
# UUIDs are matched as [0-9a-f-]+ rather than a strict UUID shape, matching
# the originals. Tighten if you ever want belt-and-braces.
SecRule REQUEST_HEADERS:Host "@streq newburycomics.spacecadetgrrl.me" \
    "id:9001012,phase:1,pass,nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/audiobookshelf/api/(?:items/[0-9a-f-]+/media(?:/.*)?|podcasts|podcasts/[0-9a-f-]+/(?:download-episodes|check-new))$" \
        "t:none,\
        ctl:ruleRemoveByTag=attack-rce,\
        ctl:ruleRemoveByTag=attack-lfi"

# Audiobookshelf: podcast episode downloads POST JSON that includes the episode's
# HTML show notes (array.array.description). Those are free text from podcast feeds,
# e.g. "&amp; Replace ICE" looks like a SQL "; REPLACE" to 942350.
# Exclude ONLY that field, ONLY on this endpoint. Every other check still applies.
SecRule REQUEST_URI "@beginsWith /audiobookshelf/api/podcasts/" \
    "id:9000116,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:array.array.description,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:array.array.description"

# Fast-drop Next.js Server Action probes on non-Next.js vhosts
# CVE-2025-29927 family - block before CRS pipeline runs
SecRule REQUEST_HEADERS:Next-Action "@rx .+" \
    "id:9000100,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Next.js Server Action probe blocked (no Next.js apps on this server)',\
    tag:'custom/next-action-recon'"

# Next.js middleware-bypass probe (CVE-2025-29927).
# Scanners send x-middleware-subrequest hoping an unpatched Next.js app will
# skip its middleware (often the auth check). No Next.js apps on this server,
# so any request carrying it is a probe: deny outright in phase 1 with a clear
# message, instead of relying only on CRS anomaly scoring.
SecRule &REQUEST_HEADERS:x-middleware-subrequest "@gt 0" \
    "id:9000101,phase:1,deny,status:403,log,\
    msg:'Next.js middleware-bypass probe blocked (CVE-2025-29927, no Next.js apps on this server)',\
    tag:'custom/next-middleware-bypass'"

# 9000111: RedTail cryptomining botnet (PHP-CGI CVE-2024-4577, PHPUnit
# eval-stdin). Identifies itself honestly as libredtail-http, so deny on sight.
SecRule REQUEST_HEADERS:User-Agent "@beginsWith libredtail" \
    "id:9000111,phase:1,deny,status:403,log,\
    msg:'run away with your redtail between your legs',\
    tag:'custom/redtail-botnet'"

# One-strike: nothing on these servers ever serves SQL dumps.
# Any request for *.sql / *.sql.gz / *.sql.zip etc. is a backup hunter.
# Pick the next free ID in your 9000100-9000129 custom range.
SecRule REQUEST_FILENAME "@rx \.sql(?:\.(?:gz|bz2|xz|zip|tar|7z))?$" \
    "id:9000112,phase:1,deny,status:403,log,\
    msg:'no dumps for you',\
    tag:'custom/sql-dump-hunter'"

# One-strike: classic "forgotten site backup" bait names at the web root.
# Matches only these names (not every .zip), so real downloads are safe.
SecRule REQUEST_FILENAME "@rx ^/(?:old/|tmp/)?(?:backup|site|www|wwwroot|web|htdocs|public_html|public|html|wordpress|wp|app|archive|old|db|dump)\.(?:zip|rar|7z|tar|tar\.gz|tgz)$" \
    "id:9000113,phase:1,deny,status:403,log,\
    msg:'no backups for you either',\
    tag:'custom/backup-archive-hunter'"

# One-strike: .env hunters (AndroxGh0st and friends). Nothing here serves dotenv files.
SecRule REQUEST_FILENAME "@rx /\.env(?:\.[a-z0-9_-]+)?$" \
    "id:9000114,phase:1,deny,status:403,log,\
    msg:'AndroxGh0st-style .env hunt',\
    tag:'custom/env-hunter'"

# One-strike: version-control metadata hunters. Nothing here serves VCS directories.
# Covers git, svn, mercurial and bazaar: /.git/HEAD, /.svn/entries, /.hg/store, ...
SecRule REQUEST_FILENAME "@rx /\.(?:git|svn|hg|bzr)(?:/|$)" \
    "id:9000115,phase:1,deny,status:403,log,\
    msg:'no source code for you',\
    tag:'custom/vcs-hunter'"

# Fast-drop Go default-UA scanners across all vhosts
# `Go-http-client` is the default User-Agent of any Go program that
# doesn't set one - it has become a near-universal tell for cheap mass
# scanners (DoH-resolver sweeps, /dns-query probes, 404 spam), since
# basically no legitimate browser or service announces itself this way.
# Deny in phase 1, before the CRS pipeline runs, so we spend no anomaly
# scoring on obvious bots. @beginsWith catches the versioned variants too
# (e.g. "Go-http-client/1.1", "Go-http-client/2.0").
SecRule REQUEST_HEADERS:User-Agent "@beginsWith Go-http-client" \
    "id:9000110,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'get tae fuck go scanner',\
    tag:'custom/go-http-client-recon'"

# Next.js middleware bypass probe (CVE-2025-29927).
# This header is internal to Next.js and is never sent by real clients,
# so any external request carrying it is a scanner. Phase 1 = blocked
# before CRS runs, on both :80 and :443.
SecRule &REQUEST_HEADERS:X-Middleware-Subrequest "@gt 0" \
    "id:9000117,phase:1,deny,status:403,log,\
    msg:'Next.js middleware bypass probe (CVE-2025-29927)',\
    tag:'custom/nextjs-middleware-bypass'"

# Matomo /matomo.php false positive: tracked URLs relay third-party URLs in the
# `url`/`urlref` args. Substrings like `check_logged_in` collide with the Unix
# command alternation check_(by_ssh|cups|log|...) in RCE rule 932235, pushing the
# anomaly score over PL1 threshold (5) and 403-ing legitimate beacons.
#
# Confirmed sole contributor via 980170 correlation (RCE=5, everything else 0),
# so removing 932235 alone drops the score to 0. 949110 left untouched - it only
# reads the score, it doesn't generate it.
#
# Scoped to the analytics vhost + the matomo.php endpoint ONLY, so all other
# RCE protection on the vhost (admin UI, API) stays fully live.
#
# 4.29 OPEN QUESTION - DO NOT ASSUME THE ABOVE STILL HOLDS:
# Upstream #4599 added backslash-prefix evasion to the shared
# unix-shell-evasion prefix, which feeds 932230/932235/932250/932260. If a
# relayed urlref containing a backslash (or %5C) now scores on a SIBLING
# rule instead of 932235, this narrow exclusion no longer covers it and
# beacons start 403-ing again. The "sole contributor" note above was
# measured on <=4.28 and has not been re-verified.
#
# Check with:
#   git diff v4.28.0..v4.29.0 -- regex-assembly/
# If a bare \x5c entered the prefix, widen this rule - either add the three
# sibling IDs, or switch to ctl:ruleRemoveByTag=attack-rce scoped to
# /matomo.php only (the beacon endpoint receives no shell input by design,
# so the breadth is defensible there in a way it would not be on the admin
# UI). Re-run the 980170 correlation either way before deciding.
SecRule SERVER_NAME "@streq analytics.spacecadetgrrl.me" \
    "id:9001009,phase:1,pass,nolog,\
    chain"
    SecRule REQUEST_FILENAME "@streq /matomo.php" \
        "t:none,\
        ctl:ruleRemoveById=932235"

# Immich/photos - the Immich mobile app uploads via Dart's HttpClient,
# which generates multipart boundaries ending in dashes (e.g.
# "dart-http-boundary-...S9P8D--"). When ModSecurity's multipart parser
# reads the closing "--boundary--" delimiter, the doubled trailing dashes
# make the opening and closing boundaries look mismatched, so
# MULTIPART_UNMATCHED_BOUNDARY is set non-zero and base rule 200004 denies
# (403) on POST /api/assets. This is a parser quirk on legal (if cheeky)
# input, NOT an attack. Note: 200004 is a base ModSecurity rule from
# modsecurity.conf, not CRS - hence no OWASP_CRS tag/ver here, and hence
# NOT tag-based: base rules carry no CRS tags to match on.
# Scoped to the asset endpoint only so boundary protection stays active
# everywhere else on the vhost.
SecRule REQUEST_HEADERS:Host "@streq photos.spacecadetgrrl.me" \
    "id:9001010,phase:1,pass,nolog,\
    chain"
    SecRule REQUEST_URI "@beginsWith /api/assets" \
        "t:none,\
        ctl:ruleRemoveById=200004"

# Tencent Cloud crawler fleet (AS132203) fingerprint:
#   1. contradictory "Connection: keep-alive, close" (no real browser sends this)
#   2. a frozen iOS 13.2.3 Safari user agent
# Both must match (chain), so neither quirk alone can cause a false positive.
# 2026-10-10, KEB: Swap to deny,status:403 when ready but it's much more fun to let 
# them waste their time in a honeypot 
SecRule REQUEST_HEADERS:Connection "@rx \bkeep-alive,\s*close\b" \
    "id:9000120,phase:1,pass,log,\
    msg:'Tencent crawler fleet fingerprint (contradictory Connection + iOS 13 UA)',\
    tag:'custom/tencent-crawler',chain"
    SecRule REQUEST_HEADERS:User-Agent "@contains iPhone OS 13_2_3" "t:none"
