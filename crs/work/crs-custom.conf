# CRS Custom Overrides                                                                                              
# Stored on persistent volume to survive CRS upgrades                                                               
# See crs-setup.conf for full configuration options    

# Fast-drop Next.js Server Action probes on non-Next.js vhosts
# CVE-2025-29927 family - block before CRS pipeline runs
SecRule REQUEST_HEADERS:Next-Action "@rx .+" \
  "id:9000100,\
  phase:1,\
  deny,\
  status:403,\
  log,\
  msg:'Next.js Server Action probe blocked (no Next.js apps on this server)',\
  tag:'custom/next-action-recon'"

# Fast-drop Go default-UA scanners across all vhosts
# `Go-http-client` is the default User-Agent of any Go program that
# doesn't set one — it has become a near-universal tell for cheap mass
# scanners (DoH-resolver sweeps, /dns-query probes, 404 spam), since
# basically no legitimate browser or service announces itself this way.
# Deny in phase 1, before the CRS pipeline runs, so we spend no anomaly
# scoring on obvious bots. @beginsWith catches the versioned variants too
# (e.g. "Go-http-client/1.1", "Go-http-client/2.0").
SecRule REMOTE_ADDR "!@ipMatch 146.112.0.0/16" \
  "id:9000110,phase:1,deny,status:403,log,\
  msg:'Go default-UA scanner blocked',\
  tag:'custom/go-http-client-recon',chain"
  SecRule REQUEST_HEADERS:User-Agent "@beginsWith Go-http-client" "t:none"

# crs-custom.conf on work-dev: same rule as Hetzner.
# Phase 1, so it fires before Apache's authz denial ends the request.
SecRule REQUEST_HEADERS:User-Agent "@beginsWith libredtail" \
  "id:9000111,phase:1,deny,status:403,log,\
  msg:'run away with your redtail between your legs',\
  tag:'custom/redtail-botnet'"

# One-strike: classic "forgotten site backup" bait names at the web root.
# Matches only these names (not every .zip), so real downloads are safe.
SecRule REQUEST_FILENAME "@rx ^/(?:old/|tmp/)?(?:backup|site|www|wwwroot|web|htdocs|public_html|public|html|wordpress|wp|app|archive|old|db|dump)\.(?:zip|rar|7z|tar|tar\.gz|tgz)$" \
  "id:9000113,phase:1,deny,status:403,log,\
  msg:'no backups for you either',\
  tag:'custom/backup-archive-hunter'"

# One-strike: nothing on these servers ever serves SQL dumps.
# Any request for *.sql / *.sql.gz / *.sql.zip etc. is a backup hunter.
# Pick the next free ID in your 9000100-9000129 custom range.
SecRule REQUEST_FILENAME "@rx \.sql(?:\.(?:gz|bz2|xz|zip|tar|7z))?$" \
  "id:9000112,phase:1,deny,status:403,log,\
  msg:'no dumps for you',\
  tag:'custom/sql-dump-hunter'"

# One-strike: .env hunters (AndroxGh0st and friends). Nothing here serves dotenv files.
SecRule REQUEST_FILENAME "@rx /\.env(?:\.[a-z0-9_-]+)?$" \
  "id:9000114,phase:1,deny,status:403,log,\
  msg:'AndroxGh0st-style .env hunt',\
  tag:'custom/env-hunter'"

# One-strike: version-control metadata hunters. Nothing here serves VCS directories.
# Covers git, svn, mercurial and bazaar: /.git/HEAD, /.svn/entries, /.hg/store, ...
SecRule REQUEST_FILENAME "@rx /\.(?:git|svn|hg|bzr)(?:/|$)" \
  "id:9000115,phase:1,deny,status:403,log,\
  msg:'no source code for you',\
  tag:'custom/vcs-hunter'"

# Next.js middleware bypass probe (CVE-2025-29927).
# This header is internal to Next.js and is never sent by real clients,
# so any external request carrying it is a scanner. Phase 1 = blocked
# before CRS runs, on both :80 and :443.
SecRule &REQUEST_HEADERS:X-Middleware-Subrequest "@gt 0" \
  "id:9000117,phase:1,deny,status:403,log,\
  msg:'Next.js middleware bypass probe (CVE-2025-29927)',\
  tag:'custom/nextjs-middleware-bypass'"

# -----------------------------------------------------------------------------
# 9000121: Drupal node edit/add, skip the multipart "unmatched boundary" check
# -----------------------------------------------------------------------------
# Why: ModSecurity 2.9.x rule 200004 (modsecurity.conf) false-positives on
#      long Paragraphs edit forms, so saves fail with a 403.
# Scope: the rule only applies when all three conditions match.
#   1. Host is dcinetwork.org (add staging. here if it shows the same problem).
#   2. Path is a node edit or add form. REQUEST_FILENAME excludes the query
#      string, so the Paragraphs AJAX calls (?ajax_form=1) are covered too.
#   3. The request carries a Drupal session cookie (SSESS + 32 hex on HTTPS).
#      A cookie name can be faked, but Drupal still requires a valid session
#      and form token, and all CRS rules still inspect the body. The only
#      thing removed is this one parser-strictness check.
# Phase 1 + ctl: ruleRemoveById runs before 200004 is evaluated in phase 2.
# ID: 9000121 (9000119 was declined; 9000120 is reserved for the PHP CVE rule).
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?dcinetwork\.org$" \
  "id:9000121,phase:1,pass,nolog,chain"
  SecRule REQUEST_FILENAME "@rx ^/node/(?:\d+/edit|add/[a-z0-9_]+)$" "chain"
    SecRule REQUEST_COOKIES_NAMES "@rx ^S?SESS[0-9a-f]{32}$" \
      "ctl:ruleRemoveById=200004"
